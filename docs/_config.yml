# Jekyll config for the JogTheRobot project site.
# GitHub Pages builds this folder when Pages is set to "Deploy from a branch", folder /docs.

title: Jog The Robot
description: >-
  An Android app that jogs a 5-axis robot arm from a phone, by touch or by body gestures,
  through an ESP32-S3 BLE-to-Modbus bridge.
author: Naz

# Link shown in the header and footer. Change it to your repository URL.
repo_url: https://github.com/nazmos-sakib/Jog-the-Robot

# Intro text above the two side-by-side videos in the Video section.
video:
  caption: Phone screen on the left, robot on the right. First touch Jog, then Gesture Jog.

# No theme: the site uses its own _layouts/default.html and assets/css/site.css.
# The stylesheet is named site.css (not style.css) so a theme's style.scss can never overwrite it.
theme: null

markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  # Media in screenshots/ that the page does not use. Excluding them keeps them out of the
  # built site. gesture-jog.png shows a private room and must never be published.
  - screenshots/gesture-jog.png
  - screenshots/jog-screen-demo-2.mov
  - screenshots/gerster-jog-demo-3-no-audio.mov
  - screenshots/5x-robotic-arm-5.jpeg
  - screenshots/5x-robotic-arm-5.jpg
  - screenshots/jog-screen-demo-2.gif
