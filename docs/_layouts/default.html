<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h8"/><path d="M8 20v-4l4-6 6-3"/><circle cx="12" cy="10" r="1.6"/><circle cx="18" cy="7" r="1.6"/><path d="M18 7l2 3"/></svg>
        </span>
        {{ site.title }}
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#about">About</a>
        <a href="#how">How it works</a>
        <a href="#demo">App</a>
        <a href="#video">Video</a>
        <a href="#hardware">Hardware</a>
        <a href="#demos">Demos</a>
        <a href="#protocol">Protocol</a>
        <a class="nav-gh" href="{{ site.repo_url }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.title }} · Android (Kotlin, Jetpack Compose) · ESP32-S3-ETH · B&amp;R PLC · igus robot arm</p>
      <p><a href="{{ site.repo_url }}">Source on GitHub</a></p>
    </div>
  </footer>
</body>
</html>
